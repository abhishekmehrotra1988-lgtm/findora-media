name: Append Findora Products
on:
  workflow_dispatch:
    inputs:
      products_json:
        description: 'JSON array of products with title, url, category, date and optional image'
        required: false
        type: string
      queue_json:
        description: 'Optional Findora daily queue JSON with publications array'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: findora-catalogue
  cancel-in-progress: false
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Write incoming products
        env:
          PRODUCTS_JSON: ${{ inputs.products_json }}
          QUEUE_JSON: ${{ inputs.queue_json }}
        run: |
          if [ -n "$QUEUE_JSON" ]; then
            printf '%s' "$QUEUE_JSON" > daily-queue.json
            python3 scripts/queue_to_products.py daily-queue.json incoming.json
          elif [ -n "$PRODUCTS_JSON" ]; then
            printf '%s' "$PRODUCTS_JSON" > incoming.json
          else
            echo 'Provide products_json or queue_json' >&2
            exit 1
          fi
      - name: Validate and append without deleting old products
        run: python3 scripts/append_products.py incoming.json
      - name: Run catalogue regression tests
        run: python3 tests/test_append_products.py
      - name: Verify no historical products were removed
        run: |
          python3 - <<'PY'
          import json,subprocess
          before=json.loads(subprocess.check_output(['git','show','HEAD:products.json']))
          after=json.load(open('products.json',encoding='utf-8'))
          previous={p['url']:p for p in before}
          current={p['url']:p for p in after}
          assert len(current)==len(after),'Duplicate URLs'
          assert all(url in current and current[url]==row for url,row in previous.items()),'Historical products changed or removed'
          print('PASS: all',len(before),'previous products preserved')
          PY
      - name: Commit catalogue changes if any
        run: |
          rm -f incoming.json daily-queue.json
          git add products.json
          if git diff --cached --quiet; then
            echo "No new products"
            exit 0
          fi
          git config user.name "findora-catalogue-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Append new Findora product entries"
          git push
